name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Guards the two failures that have reached main before: a topic with no
      # data file, and a question with no answer (which throws on submit).
      - name: Validate question data
        run: pnpm validate

      - run: pnpm build
